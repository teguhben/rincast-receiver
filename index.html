<!DOCTYPE html>
<!-- RinCast Custom Receiver v2.9 — halaman pemain TV RinCast.
     Dijalankan TV saat RinCast cast dengan app ID receiver custom.
     Satu-satunya yang dimuat dari CDN adalah CAF SDK Google (wajib
     dari gstatic). Library ASS (SubtitleOctopus) + font dibundel lokal.
     TIDAK ada gambar resmi Rin Tohsaka / logo Fate di sini. -->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RinCast</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; background: #000; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%;
    background: #000; object-fit: contain; }
  /* Canvas SubtitleOctopus disisipkan sebagai sibling video; pastikan
     ia menutup seluruh layar dan tidak menangkap sentuhan. */
  #stage canvas { position: absolute !important; inset: 0 !important;
    width: 100% !important; height: 100% !important;
    pointer-events: none !important; }
  #overlay { position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: #0C0C14; color: #F5F5FA;
    font-family: sans-serif; text-align: center; z-index: 10; }
  #overlay.hidden { display: none; }
  #overlay .gem { font-size: 72px; line-height: 1; }
  #overlay h1 { margin: 16px 0 8px; font-size: 44px; letter-spacing: 2px;
    color: #B40014; }
  #overlay p { margin: 4px 0; font-size: 22px; color: #9C9CB6;
    max-width: 80%; word-break: break-word; }
  #overlay p.file { color: #F5F5FA; font-size: 24px; }
  #msg { position: absolute; left: 0; right: 0; bottom: 8%;
    text-align: center; z-index: 20; display: none;
    font-family: sans-serif; }
  #msg span { display: inline-block; background: rgba(0,0,0,0.72);
    color: #F5F5FA; font-size: 22px; padding: 10px 22px;
    border-radius: 8px; border: 1px solid #B40014; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline></video>
  <div id="overlay">
    <div class="gem">&#128142;</div>
    <h1>RinCast</h1>
    <p id="overlay-text">Menunggu video dari HP&hellip;</p>
    <p class="file" id="overlay-file"></p>
  </div>
  <div id="msg"><span id="msg-text"></span></div>
</div>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script src="libass/subtitles-octopus.js"></script>
<script src="receiver.js"></script>
</body>
</html>
